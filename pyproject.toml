[project]
name = "fuelfam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "craftyzebra", email = "craftyzebra01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.13.0",
    "exifread>=3.5.1",
    "fastapi[standard]>=0.143.0",
    "google-maps-places>=0.9.1",
    "gpsphoto>=2.2.3",
    "piexif>=1.1.3",
    "pillow>=12.3.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
fuelfam = "fuelfam:main"
imp = "fuelfam:imp"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
