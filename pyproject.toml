[project]
name = "fuelfam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "craftyzebra", email = "craftyzebra01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.13.0",
    "pillow>=12.3.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
fuelfam = "fuelfam:main"
imp = "fuelfam:imp"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
